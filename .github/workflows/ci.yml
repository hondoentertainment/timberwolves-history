name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      # npm ci fails on Linux when the lockfile omits nested optional deps
      # (e.g. @rolldown/binding-wasm32-wasi → @emnapi/*) that Windows npm omits; npm install resolves them on the runner.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com
